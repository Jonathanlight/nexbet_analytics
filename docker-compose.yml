
networks:
  symfony:
    driver: bridge

volumes:
  symfony_db:

services:
  apache:
    container_name: nexbet_analytics_apache
    build: ./docker/build/apache
    ports:
      - '8000:80'
      - '8443:443'
    depends_on:
      - postgres
      - mailpit
    volumes:
      - './docker/etc/apache/virtualhost.conf:/etc/apache2/sites-enabled/000-default.conf:ro'
      - './docker/etc/apache/default-ssl.conf:/etc/apache2/sites-enabled/default-ssl.conf'
      - './docker/etc/php/php.ini:/usr/local/etc/php/php.ini'
      - './docker/etc/apache/ssl/:/etc/apache2/conf/ssl'
      - './app/symfony:/var/www/symfony'
    networks:
      - symfony

  postgres:
    container_name: nexbet_analytics_postgres
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - 'symfony_db:/var/lib/postgresql/data:cached'
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 'root'
      POSTGRES_DB: nexbet_analytics
    networks:
      - symfony
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d nexbet_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: nexbet_analytics_pgadmin
    image: dpage/pgadmin4:latest
    ports:
      - '8002:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nexbet.com
      PGADMIN_DEFAULT_PASSWORD: root
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    networks:
      - symfony
    depends_on:
      - postgres

  mailpit:
    image: axllent/mailpit
    container_name: nexbet_analytics_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - symfony

  node:
    container_name: nexbet_analytics_node
    image: node:20-alpine
    working_dir: /var/www/symfony
    volumes:
      - './app/symfony:/var/www/symfony'
    networks:
      - symfony
    command: tail -f /dev/null
